services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: marketpulse-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: marketpulse-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # spark-master:
  #   image: apache/spark:3.5.3-python3
  #   container_name: marketpulse-spark-master
  #   command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
  #   ports:
  #     - "8080:8080"  # Spark master web UI
  #     - "7077:7077"  # Spark master port (workers connect here)

  # spark-worker:
  #   image: apache/spark:3.5.3-python3
  #   container_name: marketpulse-spark-worker
  #   depends_on:
  #     - spark-master
  #   command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
  #   environment:
  #     SPARK_WORKER_MEMORY: 2g
  #     SPARK_WORKER_CORES: 2
  #   ports:
  #     - "8081:8081"  # Spark worker web UI

  producer:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    container_name: marketpulse-producer
    environment:
      - RAPIDAPI_KEY=${RAPIDAPI_KEY}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - kafka
    restart: on-failure

  spark-processor:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    container_name: marketpulse-spark-processor
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - POSTGRES_JDBC_URL=jdbc:postgresql://postgres:5432/marketpulse
      - POSTGRES_USER=marketpulse
      - POSTGRES_PASSWORD=marketpulse
    depends_on:
      - kafka
      - postgres
    restart: on-failure

  postgres:
    image: postgres:16
    container_name: marketpulse-postgres
    environment:
      POSTGRES_USER: marketpulse
      POSTGRES_PASSWORD: marketpulse
      POSTGRES_DB: marketpulse
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./storage/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
  
  metabase:
    image: metabase/metabase:latest
    container_name: marketpulse-metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      - postgres

volumes:
  postgres_data:
  metabase_data:


